# Hermes Agent configuration template.
#
# This file is intended to be a complete starting point for ~/.hermes/config.yaml.
# 1. Back up the existing config first.
# 2. Copy this file to ~/.hermes/config.yaml.
# 3. Replace <model-id>, <provider-name>, and <context-length>.
# 4. Put secrets in ~/.hermes/.env or service/container secrets, not here.
#
# context_length must be a plain integer, for example 1050000.
# Do not write "1.05M" or "256K". Hermes treats invalid values as missing and
# may fall back to auto/probe metadata such as 256000.

model:
  provider: custom
  default: "<model-id>"
  model: "<model-id>"
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  api_mode: chat_completions
  context_length: <context-length>
  models:
    "<model-id>":
      context_length: <context-length>

custom_providers:
  - name: "<provider-name>"
    base_url: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    api_mode: chat_completions
    model: "<model-id>"
    context_length: <context-length>
    models:
      "<model-id>":
        context_length: <context-length>

# Keeps `hermes -z ... --model <model-id>` on the custom endpoint even when
# --provider is omitted.
model_aliases:
  "<model-id>":
    provider: custom
    model: "<model-id>"
    base_url: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    api_mode: chat_completions
    context_length: <context-length>

# Keep empty unless a real fallback provider is fully configured. A broken
# fallback can accidentally route custom models to OpenRouter/OpenAI and fail.
fallback_providers: []

compression:
  enabled: true
  threshold: 0.5

security:
  # Keep true for normal use. If false, Hermes warns that API keys and tokens may
  # enter chat output, session JSONs, and logs.
  redact_secrets: true

skills:
  # Optional shared skill dirs. Hermes native skills remain in ~/.hermes/skills.
  # Remove dirs you do not use. This must be a YAML list, not a quoted string.
  external_dirs:
    - ~/.agents/skills
    - ~/.config/agents/skills
  template_vars: true
  inline_shell: false

agent:
  tool_use_enforcement: auto

auxiliary:
  compression:
    provider: custom
    model: "<model-id>"
    base_url: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    context_length: <context-length>
    timeout: 180
    extra_body: {}
  title_generation:
    provider: auto
    model: ""
    base_url: ""
    api_key: ""
    timeout: 30
    extra_body: {}

# Optional Telegram gateway settings live in .env, not config.yaml:
# TELEGRAM_BOT_TOKEN=<redacted>
# TELEGRAM_ALLOWED_USERS=<numeric-user-id>
# TELEGRAM_GROUP_ALLOWED_CHATS=<negative-chat-id>

