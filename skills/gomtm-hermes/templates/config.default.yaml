# Copy this to ~/.hermes/config.yaml. Keep interactive startup preferences out of
# service/shared env files; use `hermes --tui` explicitly for TUI sessions.

model:
  default: <model-id>
  model: <model-id>
  base_url: ${HERMES_MODEL_BASE_URL}
  api_key: ${HERMES_MODEL_API_KEY}
  api_mode: chat_completions
  context_length: 1050000
  models:
    <model-id>:
      context_length: 1050000

custom_providers:
  - name: <Provider Display Name>
    base_url: ${HERMES_MODEL_BASE_URL}
    api_key: ${HERMES_MODEL_API_KEY}
    api_mode: chat_completions
    model: <model-id>
    models:
      <model-id>:
        context_length: 1050000

model_aliases:
  <model-id>:
    provider: custom
    model: <model-id>
    base_url: ${HERMES_MODEL_BASE_URL}
    api_key: ${HERMES_MODEL_API_KEY}
    api_mode: chat_completions

skills:
  external_dirs:
    - ~/.agents/skills
  template_vars: true
  inline_shell: false

agent:
  tool_use_enforcement: auto

auxiliary:
  compression:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
    extra_body: {}
  title_generation:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
    extra_body: {}
