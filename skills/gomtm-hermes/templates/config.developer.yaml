# Hermes Agent developer configuration template.
# Copy relevant sections into ~/.hermes/config.yaml. Do not set HERMES_TUI=1 in service/shared env.

# Replace <context-length> with the real stable provider/model context window.
# Example: OpenRouter reports openai/gpt-5.5 as 1050000; unknown/unstable endpoints may use a lower tested value.

model:
  default: <model-id>
  model: <model-id>
  base_url: ${HERMES_MODEL_BASE_URL}
  api_key: ${HERMES_MODEL_API_KEY}
  api_mode: chat_completions
  # Set to the real provider/model window; e.g. OpenRouter reports openai/gpt-5.5 as 1050000.
  context_length: <context-length>
  models:
    <model-id>:
      context_length: <context-length>

custom_providers:
  - name: <Provider Display Name>
    base_url: ${HERMES_MODEL_BASE_URL}
    api_key: ${HERMES_MODEL_API_KEY}
    api_mode: chat_completions
    model: <model-id>
    context_length: <context-length>
    models:
      <model-id>:
        context_length: <context-length>

model_aliases:
  <model-id>:
    provider: custom
    model: <model-id>
    base_url: ${HERMES_MODEL_BASE_URL}
    api_key: ${HERMES_MODEL_API_KEY}
    api_mode: chat_completions
    context_length: <context-length>

compression:
  enabled: true
  threshold: 0.5

skills:
  external_dirs:
    - ~/.agents/skills
  template_vars: true
  inline_shell: false

agent:
  tool_use_enforcement: auto

mcp_servers:
  gitnexus:
    command: npx
    args:
      - -y
      - gitnexus@latest
      - mcp
    timeout: 180
    connect_timeout: 60
    supports_parallel_tool_calls: true

auxiliary:
  compression:
    provider: custom
    model: <model-id>
    base_url: ${HERMES_MODEL_BASE_URL}
    api_key: ${HERMES_MODEL_API_KEY}
    timeout: 180
    extra_body: {}
  title_generation:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
    extra_body: {}
